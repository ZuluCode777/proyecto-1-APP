# Comprueba cada cambio: tipos, pruebas, compilación y la verificación de
# extremo a extremo en Chrome contra la app compilada.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm exec tsc --noEmit

      - name: Pruebas
        run: pnpm test

      - name: Prueba del instalador de servicios
        shell: pwsh
        run: ./test/verificar-servicios.ps1

      - name: Compilación
        run: pnpm build

      # Se arranca con clave, como en la máquina con Windows: sin clave la app
      # responde 401, y con clave pasan las pruebas de /diagnostico.
      - name: Verificación de extremo a extremo
        env:
          APP_PASSWORD: clave-de-prueba-ci
        run: |
          pnpm start -H 127.0.0.1 -p 3000 &
          for i in $(seq 1 60); do curl -sf -u "ci:$APP_PASSWORD" http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u ci:mala http://127.0.0.1:3000/api/transmilenio)" = 401
          pnpm verificar http://127.0.0.1:3000
