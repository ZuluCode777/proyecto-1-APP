<!doctype html>
<html lang="es">

<title>PROTOTIPO DESECHABLE EA-02 · TransMiVoz iPhone</title>
<!--
  Prototipo desechable de EA-02 (#28), versión 0.1. No es la app TransMiVoz.
  Pregunta: ¿qué estructura permite a una persona ciega o con baja visión iniciar,
  consultar, reconocer un fallo, cancelar y recuperarse sin ayuda visual?
  Dos variantes con la misma información y distinta estructura, elegidas con ?variante=A|B:
    A «Una acción principal»: estado en una frase, una acción grande, detalles plegados.
    B «Pestañas y lista de estados»: barra de pestañas y todos los estados en lista.
  Sin red, sin guardado y sin dependencias. Datos de ejemplo; accesorio, ubicación,
  cámara y permisos de iOS están simulados. Instrucciones en README.md.
-->
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-anchor:none}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#d4d4d4;color:#000;font-size:16px;line-height:1.4}
.aviso-prototipo{margin:0;padding:10px 14px;background:#000;color:#fff;font-size:15px;text-align:center}
/* overflow:clip recorta las esquinas sin crear contenedor de desplazamiento; con hidden, las franjas fijas no se fijarían. */
.marco{max-width:390px;margin:12px auto;border:2px solid #000;border-radius:28px;overflow:clip;min-height:844px;display:flex;background:#fff}
@media (max-width:440px){.marco{margin:0;border:0;border-radius:0;max-width:none;min-height:100dvh}}
.disenio{--escala:1;--fondo:#fff;--texto:#000;--suave:#f0f0f0;--lima:#ccff00;--borde:#000;--foco:#0033cc;
  --prim-fondo:#000;--prim-texto:#fff;--sec-fondo:#fff;--urgente:#ffe3df;--importante:#fff3c4;--info:#e3f2ff;--ok:#e2fbd7;--sim:#efe6ff;
  flex:1;display:flex;flex-direction:column;min-width:0;font-size:calc(17px * var(--escala));background:var(--fondo);color:var(--texto);line-height:1.35;
  overflow-wrap:anywhere}
.disenio.baja-vision{--fondo:#000;--texto:#fff;--suave:#1a1a1a;--lima:#000;--borde:#ffff00;--foco:#00ffff;--prim-fondo:#ffff00;--prim-texto:#000;

.disenio.baja-vision [data-tono]{border-width:5px}
.disenio.baja-vision .tono-etiqueta{text-decoration:underline;text-underline-offset:.15em}
#app{flex:1;display:flex;flex-direction:column;min-width:0}
main{flex:1;padding:.5em 14px 1.2em;min-width:0}
/* Como en iOS: el título crece menos que el cuerpo en tamaños de accesibilidad. */
h1{font-size:calc(1em + 10px);line-height:1.15;margin:.4em 0 .5em}
h2{font-size:calc(1em + 3px);line-height:1.2;margin:1.1em 0 .45em}
p{margin:.45em 0}
h1:focus,h2:focus{outline:none}
h1:focus-visible,h2:focus-visible{outline:4px solid var(--foco);outline-offset:3px}
:focus-visible{outline:4px solid var(--foco);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
button{font:inherit;color:var(--texto);background:var(--sec-fondo);border:3px solid var(--borde);border-radius:14px;min-height:max(48px,2.8em);
  min-width:48px;padding:.4em 12px;text-align:left;cursor:pointer;line-height:1.25;overflow-wrap:anywhere}
button.principal{background:var(--prim-fondo);color:var(--prim-texto);font-weight:700;width:100%;font-size:calc(1em + 2px);min-height:max(64px,3.2em);text-align:center;margin:.5em 0}
button[aria-pressed="true"],button[aria-checked="true"]{font-weight:700}
/* Deshabilitado: borde discontinuo y texto que lo dice; no depende del color ni baja el contraste. */
button[aria-disabled="true"]{border-style:dashed;cursor:not-allowed}
.lista-botones{list-style:none;margin:.3em 0;padding:0;display:flex;flex-direction:column;gap:.5em}
.lista-botones button{width:100%}
.desc{margin:.2em 0 0;font-size:.9em}
.estado,[data-tono]{border:3px solid var(--borde);border-radius:12px;padding:.55em 10px;margin:.6em 0;background:var(--fondo)}
p.estado:not([data-tono]){border:0;padding:0}
[data-tono="urgente"]{background:var(--urgente);border-width:6px;border-style:double}
[data-tono="importante"]{background:var(--importante);border-style:dashed}
[data-tono="info"]{background:var(--info)}
[data-tono="ok"]{background:var(--ok)}
[data-tono="sim"]{background:var(--sim);border-style:dotted}
.tono-etiqueta{font-weight:800}
.icono{width:1.15em;height:1.15em;vertical-align:-.2em;margin-right:.3em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cabecera{display:flex;align-items:center;gap:.5em;padding:.4em 12px;background:var(--lima);border-bottom:3px solid var(--borde);min-height:max(56px,3.2em)}
.cabecera .marca{margin:0;font-weight:800}
.cabecera:empty{display:none}
.actividad{position:sticky;top:0;z-index:3;background:var(--fondo);border-bottom:3px solid var(--borde);padding:.3em 12px}
.actividad[hidden]{display:none}
.actividad .fila{display:flex;flex-wrap:wrap;gap:.4em;align-items:center;justify-content:space-between;margin:.3em 0}
.actividad .fila p{margin:0;flex:1 1 9em;font-weight:700}
.voz{display:flex;flex-wrap:wrap;gap:.4em;align-items:center;padding:.4em 12px;background:var(--suave);border-bottom:2px dashed var(--borde)}
.voz p{margin:0;flex:1 1 10em}
.pie{position:sticky;bottom:59px;z-index:3;background:var(--fondo)}
/* Con texto de 200 % o más, las franjas fijas taparían la pantalla: pasan a desplazarse con el contenido.
   La barra de pestañas conserva su tamaño, como en iOS (que ofrece el visor de contenido grande). */
.disenio.texto-grande .actividad,.disenio.texto-grande .pie{position:static}
.pie .actividad{position:static;border-top:3px solid var(--borde)}
.pie .voz{border-bottom:0;border-top:2px dashed var(--borde)}
.pestanas{position:sticky;bottom:0;z-index:4;display:grid;grid-template-columns:repeat(5,1fr);border-top:3px solid var(--borde);background:var(--lima)}
.pestanas button{font-size:13px;border:0;border-radius:0;text-align:center;padding:4px 2px;min-height:56px;font-weight:600;background:transparent;overflow-wrap:normal;hyphens:auto}
.pestanas button .icono{display:block;margin:0 auto 2px;width:22px;height:22px}
.pestanas button[aria-current="page"]{background:var(--prim-fondo);color:var(--prim-texto);font-weight:800;text-decoration:underline}
.lista-estados{list-style:none;margin:.3em 0;padding:0;display:flex;flex-direction:column;gap:.45em}
.lista-estados li{border:3px solid var(--borde);border-radius:12px;padding:.5em 10px;margin:0}
.lista-estados .etiqueta{font-weight:800;display:block}
.lista-estados .fila-accion{margin-top:.35em}
dl.detalles{margin:.4em 0}
dl.detalles dt{font-weight:800;margin-top:.4em}
dl.detalles dd{margin:0}
details{border:3px solid var(--borde);border-radius:12px;margin:.8em 0;padding:0 10px}
details>summary{min-height:max(48px,2.8em);display:flex;align-items:center;font-weight:700;cursor:pointer}
label.campo{display:block;font-weight:700;margin:.6em 0 .2em}
input[type=text],input[type=password]{font:inherit;width:100%;min-height:max(48px,2.8em);border:3px solid var(--borde);border-radius:12px;padding:.35em 10px;background:var(--fondo);color:var(--texto)}
input[aria-invalid="true"]{border-width:5px;border-style:dashed}
fieldset{border:3px solid var(--borde);border-radius:12px;margin:.8em 0;padding:.3em 10px .6em;min-width:0;min-inline-size:0}
legend{font-weight:800;padding:0 .3em}
label.opcion{display:flex;align-items:center;gap:.5em;min-height:max(48px,2.8em);border:3px solid var(--borde);border-radius:12px;padding:.25em 10px;margin:.4em 0;cursor:pointer}
label.opcion input{width:1.3em;height:1.3em;flex:none;margin:0;accent-color:var(--texto)}
label.opcion:has(input:checked){border-width:5px;font-weight:800}
.fuente{font-size:.9em}
ol.pasos{padding-left:min(1.6em,32px)}
ol.pasos li{margin:.35em 0}
.visor{position:relative;overflow:hidden;border:3px solid var(--borde);border-radius:12px;height:12em;background:#222}
.visor svg{width:100%;height:100%;transform-origin:center;transition:transform .2s}
@media (prefers-reduced-motion:reduce){.visor svg{transition:none}}
.fila-botones{display:flex;flex-wrap:wrap;gap:.5em;margin:.5em 0}
.fila-botones button{flex:1 1 6em}
dialog{font:inherit;color:var(--texto);background:var(--fondo);border:4px solid var(--borde);border-radius:18px;padding:.6em 14px 1em;max-width:min(92vw,370px);width:100%;max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog.sistema{border-radius:22px}
dialog .sim-etiqueta{margin:.2em 0 .4em;font-size:.85em;font-weight:800}
/* Panel del facilitador: deliberadamente distinto del diseño evaluado. */
.panel{max-width:720px;margin:16px auto 40px;padding:10px 14px;border:3px dashed #5b2a86;background:#fff;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#000}
.panel summary{font-weight:700;cursor:pointer;min-height:36px}
.panel fieldset{border:1px solid #5b2a86;border-radius:6px;margin:8px 0;padding:6px 8px}
.panel legend{font-weight:700}
.panel button,.panel select{font:inherit;min-height:36px;margin:3px 2px;padding:4px 8px;border:2px solid #5b2a86;border-radius:6px;background:#fff;color:#000}
.panel .variante{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

</head>
<body>
<p class="aviso-prototipo"><strong>Prototipo desechable EA-02, versión 0.1.</strong> No es la app TransMiVoz. Usa datos de ejemplo, simula accesorio, ubicación, cámara y permisos de iOS, y no guarda nada.</p>
<div class="marco">
  <div id="disenio" class="disenio">
    <div id="app"></div>
    <dialog id="hoja" aria-labelledby="hoja-titulo"></dialog>
    <dialog id="sistema" class="sistema" role="alertdialog" aria-labelledby="sistema-titulo" aria-describedby="sistema-sim sistema-texto"></dialog>
  </div>
</div>

      <select data-panel-campo="red" aria-label="Servidor">

        <option value="timeout">Servidor sin respuesta (tiempo de espera)</option><option value="5xx">Error del servidor (5xx)</option></select>

        <option value="vigente">Evidencia de paradas vigente</option><option value="vencida">Evidencia vencida</option></select>
      <select data-panel-campo="franja" aria-label="Hora simulada">
        <option value="en-franja">Hora dentro del horario</option><option value="fuera">Hora fuera del horario</option></select>
      <select data-panel-campo="operador" aria-label="Anuncios del operador">
        <option value="sin-fuente">Sin fuente de anuncios</option><option value="ejemplo">Anuncio de ejemplo ficticio</option></select>
    </fieldset>
    <fieldset><legend>Ubicación</legend>
      <select data-panel-campo="gps" aria-label="Calidad de la ubicación">
        <option value="precisa">Precisa (±8 m, 180 m)</option><option value="cerca">Cerca (±6 m, 20 m)</option>
        <option value="imprecisa">Imprecisa (±200 m, 20 m)</option><option value="vieja">Antigua (hace 3 min)</option>

    </fieldset>
    <fieldset><legend>Accesorio (simulado)</legend>
      <button type="button" data-panel="medicion-frente">Objeto a 1,2 m al frente</button>
      <button type="button" data-panel="medicion-sin-angulo">Objeto a 0,8 m sin dirección</button>
      <button type="button" data-panel="sin-deteccion">Sin detección</button>

    <fieldset><legend>Audio</legend>
      <select data-panel-campo="audio" aria-label="Salida de audio">
        <option value="auriculares">Auriculares conectados</option><option value="altavoz">Altavoz del iPhone</option>
        <option value="interrumpido">Interrumpido por llamada</option><option value="sin-salida">Auriculares desconectados</option></select>
    </fieldset>
    <fieldset><legend>Comprobación</legend>
      <button type="button" data-panel="comprobar">Comprobar accesibilidad de la pantalla</button>
    </fieldset>
    <output id="panel-salida" role="status"></output>
  </details>
</aside>
<div id="anuncio-cortes" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<script>

const E = estadoInicial()
const temporizadores = new Set()
function despues(ms, fn) {
  const id = setTimeout(() => { temporizadores.delete(id); fn() }, ms)
  temporizadores.add(id)
  return id
}

// ---------- Utilidades de DOM y texto ----------
function h(etiqueta, atributos, ...hijos) {
  const el = document.createElement(etiqueta)
  for (const [clave, valor] of Object.entries(atributos || {})) {
    if (valor === null || valor === undefined || valor === false) continue
    if (clave === 'on') for (const [evento, fn] of Object.entries(valor)) el.addEventListener(evento, fn)
    else if (clave === 'clase') el.className = valor
    else if (clave === 'valor') el.value = valor
    else el.setAttribute(clave, valor === true ? '' : valor)
  }
  for (const hijo of hijos.flat(Infinity)) {
    if (hijo === null || hijo === undefined || hijo === false) continue
    el.append(hijo instanceof Node ? hijo : String(hijo))
  }
  return el
}

  viaje: '<path d="M5 4h14v13H5zM5 11h14M8 20v-3M16 20v-3"/>',

// ---------- Sesión de proximidad con accesorio simulado ----------
const ESTADOS_ACTIVOS = ['conectando', 'sinDeteccion', 'medicion', 'sinDatos', 'incompatible']
function sesionActiva() { return ESTADOS_ACTIVOS.includes(E.acc.estado) }
function textoSesion() {
  const a = E.acc
  switch (a.estado) {
    // «corto» + «nota» (filas de B) dicen lo mismo que «largo» (frase de A).
    case 'sinPermiso': return { tono: 'importante', corto: 'Sin permiso de Bluetooth', nota: 'Actívalo en Ajustes de iOS; el resto de la app funciona', largo: 'No puedo usar el accesorio: falta el permiso de Bluetooth. Puedes activarlo en Ajustes de iOS. El resto de la app funciona.' }
    case 'bluetoothApagado': return { tono: 'importante', corto: 'Bluetooth apagado', nota: 'Enciéndelo para usar el accesorio', largo: 'Bluetooth está apagado. Enciéndelo para usar el accesorio.' }
    case 'conectando': return { tono: 'info', corto: 'Conectando', nota: null, largo: `Conectando con ${a.elegido}.` }
    case 'incompatible': return { tono: 'importante', corto: 'Accesorio incompatible', nota: 'No muestro mediciones', largo: 'El accesorio envía una versión de datos que esta app no entiende. No muestro mediciones.' }

    case 'sinDeteccion': return { tono: 'info', corto: 'Activa, sin detección', nota: 'Esto no significa que el camino esté libre', largo: 'Sensor activo, sin detección. Esto no significa que el camino esté libre.' }
    case 'medicion': return { tono: 'urgente', corto: `Objeto a ${distanciaSensor(a.mm)} m`, nota: `${a.sector ? a.sector[0].toUpperCase() + a.sector.slice(1) : 'Sin dirección'}; medición relativa al sensor`, largo: `Objeto detectado a ${distanciaSensor(a.mm)} m${a.sector ? ', ' + a.sector : ', sin dirección'}. Medición relativa al sensor.` }
    default: return { tono: 'neutro', corto: 'Detenida', nota: null, largo: 'La sesión de proximidad está detenida.' }
  }
}
function iniciarSesion() {
  if (E.permisos.bluetooth !== 'concedido') {
    return pedirPermiso('bluetooth', {
      siguiente: iniciarSesion,
      alternativa: (motivo) => {
        if (motivo === 'denegado') { E.acc.estado = 'sinPermiso'; decir(textoSesion().largo) }
        repintar()
      },
    })
  }
  if (E.acc.bluetooth === 'apagado') { E.acc.estado = 'bluetoothApagado'; decir(textoSesion().largo); return repintar() }
  if (!E.acc.elegido) {
    E.acc.buscando = true
    decir('Elige tu accesorio para iniciar la sesión.')
    return pantalla() === 'accesorio' ? repintar({ enfocar: 'h1' }) : irArea('accesorio')
  }
  const turno = ++E.acc.turno
  E.acc.estado = 'conectando'
  decir(`Conectando con ${E.acc.elegido}, simulado.`)
  repintar()
  despues(1500, () => {
    if (E.acc.turno !== turno || E.acc.estado !== 'conectando') return
    E.acc.estado = E.acc.incompatible ? 'incompatible' : 'sinDeteccion'
    resolverAviso('accesorio-desconectado')
    decir(E.acc.estado === 'incompatible' ? textoSesion().largo : 'Sesión iniciada. Sensor activo, sin detección. Esto no significa que el camino esté libre.')
    repintar()
  })
}
function detenerSesion({ texto = 'Sesión detenida. No recibirás avisos de proximidad.' } = {}) {
  E.acc.turno++
  E.acc.estado = 'desactivada'
  resolverAviso('accesorio-desconectado')
  resolverAviso('dato-vencido')
  decir(texto)
  repintar({ respaldo: ['sesion-principal', 'acc-principal', 'fila-sesion'] })
}
function elegirAccesorio() {

// Una medición vence a los 3 s sin dato nuevo: se informa el fallo, nunca la distancia anterior.
function inyectarMedicion(mm, sector) {
  if (!['sinDeteccion', 'medicion'].includes(E.acc.estado)) return 'Primero inicia la sesión y espera «sin detección».'
  const medida = ++E.acc.medida
  Object.assign(E.acc, { estado: 'medicion', mm, sector })
  resolverAviso('dato-vencido')
  const cortaEscucha = E.asis.fase === 'escuchando'
  if (cortaEscucha) {
    E.asis.turno++
    E.asis.fase = 'interrumpido'
  }
  decir(`Objeto a ${distanciaSensor(mm)} metros${sector ? ', ' + sector : ''}.${cortaEscucha ? ' La escucha se detuvo.' : ''}`, { urgente: true })
  repintar()
  despues(3000, () => {
    if (E.acc.medida !== medida || E.acc.estado !== 'medicion') return
    Object.assign(E.acc, { estado: 'sinDatos', motivo: 'dato vencido' })
    avisar('dato-vencido', { severidad: 'importante', texto: 'El dato del sensor venció. No repito la distancia anterior.', fuente: 'Accesorio (simulado)' })
    decir('Dato del sensor vencido. No hay aviso de proximidad.')
    repintar()
  })
  return 'Medición enviada; vence en 3 s sin dato nuevo.'
}

  if (!['medicion', 'sinDatos', 'sinDeteccion'].includes(E.acc.estado)) return 'La sesión no está activa.'
  E.acc.medida++
  E.acc.estado = 'sinDeteccion'
  resolverAviso('dato-vencido')
  resolverAviso('accesorio-desconectado')
  decir('Sensor activo, sin detección. Esto no significa que el camino esté libre.')

function desconectarAccesorio() {

  E.acc.medida++

  const texto = 'Se perdió la conexión con el accesorio. No hay avisos de proximidad.'
  avisar('accesorio-desconectado', { severidad: 'urgente', texto, fuente: 'Accesorio (simulado)' })
  decir(texto, { urgente: true })
  repintar()

}
function programarDesconexion(segundos) {

// ---------- Ubicación: siempre con precisión y antigüedad ----------
function gpsActual() {
  const g = { ...GPS[E.permisos.exacta ? E.gps.escenario : 'aproximada'] }
  g.clave = E.permisos.exacta ? E.gps.escenario : 'aproximada'
  g.utilizable = !['imprecisa', 'vieja', 'aproximada'].includes(g.clave)
  return g
}
function direccion(g) { return g.brujula ? 'hacia adelante, a tu derecha' : 'al noreste' }
function textoGps() {
  if (E.permisos.ubicacion === 'denegado') return { tono: 'importante', corto: 'Sin permiso', largo: 'No tengo permiso de ubicación. Puedes escribir tu origen.' }
  if (E.gps.fase === 'inactivo') return { tono: 'neutro', corto: 'Apagada', largo: 'La ubicación está apagada en esta app.' }
  if (E.gps.fase === 'buscando') return { tono: 'info', corto: 'Buscando', largo: 'Buscando tu ubicación.' }
  const g = gpsActual()
  switch (g.clave) {
    case 'aproximada': return { tono: 'importante', corto: 'Aproximada (±3 km)', largo: 'iOS solo comparte una ubicación aproximada, de unos 3 km. No sirve para orientarte hacia la estación. Escribe tu origen o activa Ubicación exacta en Ajustes de iOS.' }
    case 'vieja': return { tono: 'importante', corto: `Antigua (${antiguedad(g.edad)})`, largo: `Tu última ubicación es de ${antiguedad(g.edad)}. Actualízala antes de orientarte.` }
    case 'imprecisa': return { tono: 'importante', corto: `Imprecisa (±${g.precision} m)`, largo: `Ubicación imprecisa, ±${g.precision} m. La estación más cercana sería ${ESTACION_CERCANA}, pero no puedo saber si llegaste.` }
    default: return { tono: 'info', corto: `±${g.precision} m, ${antiguedad(g.edad)}`, largo: `La estación más cercana es ${ESTACION_CERCANA}, a ${metros(g.distancia)} ${direccion(g)}.` }
  }
}
function indicacionGps() {
  const g = gpsActual()
  if (!g.utilizable) return textoGps().largo
  if (g.distancia <= 30) return `Estás a unos ${metrosHablados(g.distancia)} de ${ESTACION_CERCANA}. Esto no confirma que estés en un acceso.`
  const ref = g.brujula ? 'según la brújula del iPhone' : 'no sé hacia dónde miras'
  return `${ESTACION_CERCANA} está a ${metrosHablados(g.distancia)} ${direccion(g)}, ${ref}. Es distancia en línea recta, no un camino peatonal.`
}
// Cada búsqueda tiene su turno: una búsqueda cancelada o abandonada nunca completa otra posterior.
// Sin búsqueda no queda ubicación actual, así que la orientación también se detiene.
// Devuelve la frase sobre la orientación (vacía si no estaba activa) para que quien llama la incluya.
const ORIENTACION_DETENIDA = ' Orientación detenida: no hay ubicación actual.'
function cancelarBusquedaGps({ silencioso = false } = {}) {
  E.gps.turno++
  E.gps.fase = 'inactivo'
  const extra = E.gps.guiando ? ORIENTACION_DETENIDA : ''
  E.gps.guiando = false
  if (!silencioso) { decir('Búsqueda de ubicación cancelada.' + extra); repintar({ respaldo: ['gps-principal', 'origen-gps'] }) }
  return extra
}
function activarUbicacion({ luego } = {}) {
  pedirPermiso('ubicacion', {
    siguiente: () => {
      const turno = ++E.gps.turno
      Object.assign(E.gps, { fase: 'buscando', desde: pantalla() })
      decir('Buscando tu ubicación.')
      repintar({ respaldo: ['gps-principal', 'origen-gps'] })
      despues(1200, () => {
        if (E.gps.turno !== turno || E.gps.fase !== 'buscando') return
        E.gps.fase = 'listo'
        const g = gpsActual()
        if (!g.utilizable) avisar('gps', { severidad: 'importante', texto: textoGps().largo, fuente: 'Ubicación (simulada)' })
        else resolverAviso('gps')
        if (luego) return luego()
        decir(indicacionGps())
        repintar()
      })
    },
    alternativa: (motivo) => {
      if (luego && motivo !== 'omitido') return luego()

// Al repintar se conserva el foco por data-id: la persona no pierde su lugar en VoiceOver.
// Ancla de lectura: el primer bloque del contenido que se ve en pantalla. Tras repintar se busca el mismo

  const mismaPantalla = pintada.pantalla === pantalla() && pintada.variante === E.variante
  const desplazamiento = window.scrollY
  const ancla = mismaPantalla ? anclaVisible() : null
  const abiertos = new Set(mismaPantalla ? [...document.querySelectorAll('#app details[open] > summary[data-id]')].map((s) => s.dataset.id) : [])

  contenido.replaceChildren()

  for (const s of document.querySelectorAll('#app details > summary[data-id]')) if (abiertos.has(s.dataset.id)) s.parentElement.open = true
  pintada = { pantalla: pantalla(), variante: E.variante }
  if (mismaPantalla) restaurarAncla(ancla, desplazamiento)
  if (document.querySelector('dialog[open]')) return
  // Prioridad: destinos pedidos (en orden), luego el control que tenía el foco, luego el título.
  // Si el foco estaba en la app y su control desapareció, nunca queda en <body>.
  const buscar = (id) => (id === 'h1' ? $('#contenido h1') : $(`#app [data-id="${CSS.escape(id)}"]`))
  // Si el control enfocado desaparece, el foco va al respaldo que pidió la acción; si tampoco está y venía de la franja, a «Repetir».
  const candidatos = [...[].concat(enfocar || []), ...(idFoco ? [idFoco] : []), ...[].concat(respaldo || []), ...(enActividad ? ['repetir-voz'] : [])]
  let objetivo = null
  for (const id of candidatos) { objetivo = buscar(id); if (objetivo) break }
  if (!objetivo && (enfocar || enApp)) objetivo = $('#contenido h1')
  if (objetivo && objetivo !== document.activeElement) {

    objetivo.focus({ preventScroll: mismaPantalla && mismoControl })
    if (seleccion && mismoControl && objetivo.setSelectionRange) objetivo.setSelectionRange(seleccion[0], seleccion[1])

// ---------- Panel del facilitador ----------
const NOMBRES_VARIANTE = { A: 'A — Una acción principal', B: 'B — Pestañas y lista de estados' }

})

// ---------- Comprobación automática (heurística, no sustituye VoiceOver) ----------
function rgba(texto) {
  const m = /rgba?\(([^)]+)\)/.exec(texto)
  if (!m) return null
  const p = m[1].split(/[\s,/]+/).filter(Boolean).map(Number)
  return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 }
}
function mezclar(arriba, abajo) {
  const a = arriba.a
  return { r: arriba.r * a + abajo.r * (1 - a), g: arriba.g * a + abajo.g * (1 - a), b: arriba.b * a + abajo.b * (1 - a), a: 1 }
}
function luminancia({ r, g, b }) {
  const c = [r, g, b].map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4) })
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]
}
function contraste(a, b) { const [x, y] = [luminancia(a), luminancia(b)].sort((m, n) => n - m); return (x + 0.05) / (y + 0.05) }
function fondoEfectivo(el) {
  const capas = []
  for (let n = el; n; n = n.parentElement) {
    const c = rgba(getComputedStyle(n).backgroundColor)
    if (c && c.a > 0) { capas.push(c); if (c.a >= 1) break }
  }
  let color = { r: 255, g: 255, b: 255, a: 1 }
  for (const c of capas.reverse()) color = mezclar(c, color)
  return color
}
function visible(el) {
  const r = el.getBoundingClientRect(), cs = getComputedStyle(el)
  return r.width > 0 && r.height > 0 && cs.visibility !== 'hidden' && cs.display !== 'none' && !el.closest('.sr-only, [hidden], dialog:not([open])')
}
function textoSinOcultos(el) {
  let t = ''
  for (const n of el.childNodes) {
    if (n.nodeType === 3) t += n.textContent
    else if (n.nodeType === 1 && n.getAttribute('aria-hidden') !== 'true' && !n.matches('input, select, textarea')) t += textoSinOcultos(n)
  }
  return t.replace(/\s+/g, ' ')
}
function nombreAccesible(el) {
  if (el.getAttribute('aria-label')) return el.getAttribute('aria-label')
  const ids = el.getAttribute('aria-labelledby')
  if (ids) return ids.split(' ').map((id) => { const x = document.getElementById(id); return x ? textoSinOcultos(x) : '' }).join(' ').trim()
  if (el.labels && el.labels.length) return [...el.labels].map(textoSinOcultos).join(' ').trim()
  return textoSinOcultos(el).trim() || el.getAttribute('title') || ''
}
function describir(el) { return `${el.tagName.toLowerCase()}${el.dataset && el.dataset.id ? '#' + el.dataset.id : ''} «${nombreAccesible(el).slice(0, 40)}»` }

// Aproximación del recorrido lineal de VoiceOver (deslizar a la derecha): encabezados, controles,
// imágenes y bloques de texto en orden del documento. VoiceOver real puede agrupar distinto.
const INTERACTIVO = 'button, a[href], input, select, textarea, summary'
const BLOQUE = /^(P|LI|DT|DD|LEGEND|LABEL|DIV|SECTION|MAIN|NAV|UL|OL|DL|FORM|FIELDSET|DETAILS|HEADER|FOOTER)$/
function esParada(el) { return el.matches(INTERACTIVO) || /^H[1-6]$/.test(el.tagName) || el.getAttribute('role') === 'img' }
function paradasLectura() {
  const dialogo = document.querySelector('dialog[open]')
  const raices = dialogo ? [dialogo] : [$('.aviso-prototipo'), $('#app')]
  const paradas = []
  const visitar = (el) => {
    if (el.getAttribute('aria-hidden') === 'true' || !visible(el)) return
    if (esParada(el)) { paradas.push({ tipo: el.tagName.toLowerCase(), texto: nombreAccesible(el), id: el.dataset ? el.dataset.id || null : null }); return }
    if (BLOQUE.test(el.tagName) && !(el.tagName === 'LABEL' && el.querySelector('input'))) {
      let texto = ''
      for (const n of el.childNodes) {
        if (n.nodeType === 3) texto += n.textContent
        else if (n.nodeType === 1 && !BLOQUE.test(n.tagName) && !esParada(n) && n.getAttribute('aria-hidden') !== 'true') texto += textoSinOcultos(n)
      }
      if (texto.trim()) paradas.push({ tipo: 'texto', texto: texto.trim().replace(/\s+/g, ' '), id: null })
    }
    for (const hijo of el.children) {
      if (el.tagName === 'DETAILS' && !el.open && hijo.tagName !== 'SUMMARY') continue
      if (BLOQUE.test(hijo.tagName) || esParada(hijo) || hijo.querySelector(INTERACTIVO + ', h1, h2, h3, [role="img"]')) visitar(hijo)
    }
  }
  for (const r of raices) if (r) visitar(r)
  return paradas
}
function comprobar() {
  const dialogo = document.querySelector('dialog[open]')
  const raiz = dialogo || $('#disenio')
  const caja = dialogo ? { left: 0, right: innerWidth } : raiz.getBoundingClientRect()
  const interactivos = [...raiz.querySelectorAll(INTERACTIVO)].filter(visible)
  const pequenos = [], sinNombre = [], nombres = new Map()
  for (const el of interactivos) {
    const nombre = nombreAccesible(el).trim().toLowerCase()
    if (nombre && !el.matches('input[type=radio]')) nombres.set(nombre, (nombres.get(nombre) || 0) + 1)
    const objetivo = el.matches('input[type=radio], input[type=checkbox]') ? el.closest('label') || el : el
    const r = objetivo.getBoundingClientRect()
    if (r.width < 43.5 || r.height < 43.5) pequenos.push(`${describir(el)} ${Math.round(r.width)}×${Math.round(r.height)}`)
    if (!nombreAccesible(el)) sinNombre.push(describir(el))
  }
  const bajos = []
  let minimo = Infinity
  const caminante = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT)
  for (let n = caminante.nextNode(); n; n = caminante.nextNode()) {
    const el = n.parentElement
    if (!n.textContent.trim() || !visible(el) || el.closest('.recorte, svg')) continue
    const fondo = fondoEfectivo(el)
    const ratio = contraste(mezclar(rgba(getComputedStyle(el).color), fondo), fondo)
    minimo = Math.min(minimo, ratio)
    if (ratio < 7) bajos.push(`${ratio.toFixed(2)} «${n.textContent.trim().slice(0, 30)}»`)
  }
  const desbordes = [...raiz.querySelectorAll('*')].filter((el) => visible(el) && !el.closest('.recorte'))
    .filter((el) => { const r = el.getBoundingClientRect(); return r.right > caja.right + 1 || r.left < caja.left - 1 }).map(describir)
  const tonosSinTexto = [...raiz.querySelectorAll('[data-tono]')].filter(visible).filter((el) => !el.querySelector('.tono-etiqueta')).map(describir)
  // Palabras que no caben en una línea y se parten: no es desborde, pero dificulta la lectura.
  const partidas = []
  const rango = document.createRange()
  const textos = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT)
  for (let n = textos.nextNode(); n; n = textos.nextNode()) {
    if (!n.textContent.trim() || !visible(n.parentElement) || n.parentElement.closest('.recorte, svg')) continue
    for (const m of n.textContent.matchAll(/\S{4,}/g)) {
      rango.setStart(n, m.index); rango.setEnd(n, m.index + m[0].length)
      if (new Set([...rango.getClientRects()].filter((r) => r.width > 0).map((r) => Math.round(r.top))).size > 1) partidas.push(m[0])
    }
  }
  return {
    variante: E.variante, pantalla: pantalla(), texto: E.ajustes.texto, bajaVision: E.ajustes.bajaVision, dialogo: dialogo ? dialogo.id : null,
    interactivos: interactivos.length, pequenos, sinNombre, nombresRepetidos: [...nombres].filter(([, n]) => n > 1).map(([nombre, n]) => `${nombre} ×${n}`), contrasteMinimo: Number(minimo.toFixed(2)), contrasteBajo: bajos.slice(0, 5),
    desbordes: desbordes.slice(0, 5), tonosSinTexto, palabrasPartidas: partidas, h1: [...$('#contenido').querySelectorAll('h1')].filter(visible).length, paradas: paradasLectura().length,
  }
}

function viajeListo(o, d) { Object.assign(E.viaje, { origen: o, destino: d, fase: 'resultado', resultado: planear(o, d) }) }

  'asistente-error': ['asistente', () => { E.red = '429'; Object.assign(E.asis, { oido: 'horario 8 G', fase: 'error', respuesta: responderAsistente('horario 8 G') }) }],
  'avisos-vacio': ['avisos', () => {}],

    avisar('gps', { severidad: 'importante', texto: 'Ubicación imprecisa, ±200 m. No confirmo llegadas.', fuente: 'Ubicación (simulada)' })
    avisar('accesorio-desconectado', { severidad: 'urgente', texto: 'Se perdió la conexión con el accesorio. No hay avisos de proximidad.', fuente: 'Accesorio (simulado)' })
  }],
  'accesorio-sin-elegir': ['accesorio', () => {}],
  'accesorio-buscando': ['accesorio', () => { E.permisos.bluetooth = 'concedido'; E.acc.buscando = true }],
  'accesorio-medicion': ['accesorio', () => { sesionLista('medicion'); Object.assign(E.acc, { mm: 1200, sector: 'al frente' }) }],
  'accesorio-desconectado': ['accesorio', () => { sesionLista('sinDatos'); E.acc.motivo = 'se perdió la conexión con el accesorio'; avisar('accesorio-desconectado', { severidad: 'urgente', texto: 'Se perdió la conexión con el accesorio. No hay avisos de proximidad.', fuente: 'Accesorio (simulado)' }) }],

  mas: ['mas', () => {}],

  'sistema-ubicacion': ['gps', () => {}, () => avisoSistema('ubicacion', () => {}, () => {})],
}
function preparar(nombre, { variante = E.variante, texto = E.ajustes.texto, bajaVision = E.ajustes.bajaVision } = {}) {
  const [destino, ajustar, despuesDeRender] = PREPARADOS[nombre]
  reiniciar({ conservar: false })
  E.variante = variante
  Object.assign(E.ajustes, { texto, bajaVision })
  ajustar()
  if (destino) irArea(destino, { enfocar: 'h1' })
  else repintar({ enfocar: 'h1' })
  if (despuesDeRender) despuesDeRender()
  return comprobar()
}

// ---------- Arranque: ?variante=A|B&escenario=T1&panel=0&texto=200&bajavision=1 ----------
const parametros = new URLSearchParams(location.search)
// El escenario va primero; los parámetros de texto y baja visión de la dirección mandan sobre él.
const escenario = parametros.get('escenario')
if (escenario && ESCENARIOS[escenario]) { ESCENARIOS[escenario][1](); $('#panel-escenario').value = escenario }
if (['A', 'B'].includes(parametros.get('variante'))) E.variante = parametros.get('variante')
if ([100, 135, 200, 310].includes(Number(parametros.get('texto')))) E.ajustes.texto = Number(parametros.get('texto'))
if (parametros.get('bajavision') === '1') E.ajustes.bajaVision = true
if (parametros.get('panel') === '0') $('#panel').hidden = true
// ?desconectar=20 desconecta el accesorio a los 20 s, para T9 sin el panel visible.
const segundos = Number(parametros.get('desconectar'))
if (segundos > 0 && segundos <= 600) programarDesconexion(segundos)
repintar()
window.prototipo = { version: VERSION, E, repintar, irArea, volver, cambiarVariante, aplicarEscenario, reiniciar, preparar, PREPARADOS, comprobar, paradasLectura, planear, responderAsistente, ACCIONES_PANEL, CAMPOS_PANEL }
})()
